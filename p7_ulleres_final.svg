<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fonsDark2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3436"/>
      <stop offset="100%" stop-color="#1e272e"/>
    </linearGradient>
    <radialGradient id="pellUlls2" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fedac6"/>
      <stop offset="70%" stop-color="#f5ba9e"/>
      <stop offset="100%" stop-color="#de9b7d"/>
    </radialGradient>
    <!-- Il·luminació suau sota els ulls -->
    <radialGradient id="pellLluminosa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0e6"/>
      <stop offset="70%" stop-color="#fee1d2"/>
      <stop offset="100%" stop-color="#f7be9f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#fonsDark2)"/>

  <!-- PRIMER PLA DE LA ZONA DELS ULLS RETOCADA -->
  <g id="zona-ulls">
    <rect x="50" y="50" width="500" height="350" rx="15" fill="url(#pellUlls2)"/>

    <!-- Pont del nas central -->
    <path d="M290 80 Q285 240 270 340 Q300 360 330 340 Q315 240 310 80" fill="#f0ab8d" opacity="0.4"/>
    <path d="M285 200 Q280 280 272 320" stroke="#cf8566" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- ULL ESQUERRE -->
    <path d="M120 135 Q180 110 240 130" stroke="#2c1d11" stroke-width="8" stroke-linecap="round" fill="none"/>
    <ellipse cx="185" cy="185" rx="45" ry="24" fill="#ffffff"/>
    <circle cx="185" cy="185" r="18" fill="#3867d6"/>
    <circle cx="185" cy="185" r="9" fill="#111111"/>
    <circle cx="180" cy="178" r="4.5" fill="#ffffff"/>
    <path d="M138 185 Q185 155 232 185" stroke="#1e272e" stroke-width="4.5" fill="none"/>
    <path d="M142 185 Q185 208 228 185" stroke="#cf8566" stroke-width="2" fill="none"/>

    <!-- ZONA SOTA L'ULL ESQUERRE: ULLERA ATENUADA NATURALMENT AMB PEGAT (FINAL) -->
    <!-- Lluentor suau i to saludable que manté el relleu natural de la galta -->
    <ellipse cx="185" cy="222" rx="45" ry="16" fill="url(#pellLluminosa)" opacity="0.75"/>
    <path d="M145 220 Q185 232 225 220" stroke="#d49277" stroke-width="1.5" fill="none" opacity="0.45"/>

    <!-- ULL DRET -->
    <path d="M360 130 Q420 110 480 135" stroke="#2c1d11" stroke-width="8" stroke-linecap="round" fill="none"/>
    <ellipse cx="415" cy="185" rx="45" ry="24" fill="#ffffff"/>
    <circle cx="415" cy="185" r="18" fill="#3867d6"/>
    <circle cx="415" cy="185" r="9" fill="#111111"/>
    <circle cx="410" cy="178" r="4.5" fill="#ffffff"/>
    <path d="M368 185 Q415 155 462 185" stroke="#1e272e" stroke-width="4.5" fill="none"/>
    <path d="M372 185 Q415 208 458 185" stroke="#cf8566" stroke-width="2" fill="none"/>

    <!-- ZONA SOTA L'ULL DRET: ULLERA ATENUADA NATURALMENT AMB PEGAT (FINAL) -->
    <ellipse cx="415" cy="222" rx="45" ry="16" fill="url(#pellLluminosa)" opacity="0.75"/>
    <path d="M375 220 Q415 232 455 220" stroke="#d49277" stroke-width="1.5" fill="none" opacity="0.45"/>
  </g>

  <!-- Distintiu visual -->
  <rect x="25" y="25" width="220" height="32" rx="6" fill="#20bf6b" opacity="0.95"/>
  <text x="35" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">FINAL: Ulleres atenuades ✓</text>
</svg>