<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Fons degradat violeta suau -->
    <radialGradient id="fonsVinyeta" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fdf0ed"/>
      <stop offset="60%" stop-color="#ede2fe"/>
      <stop offset="100%" stop-color="#dcd0f7"/>
    </radialGradient>
    <!-- Pelatge taronja gat -->
    <linearGradient id="gatPell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb142"/>
      <stop offset="50%" stop-color="#ff793f"/>
      <stop offset="100%" stop-color="#cd6133"/>
    </linearGradient>
    <!-- Pit i morro blanc crema -->
    <radialGradient id="blancMorro" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#fff5ea"/>
      <stop offset="100%" stop-color="#f8e0cd"/>
    </radialGradient>
    <!-- Ulls maragda -->
    <radialGradient id="ullsVerds" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7bed9f"/>
      <stop offset="50%" stop-color="#2ed573"/>
      <stop offset="100%" stop-color="#10ac84"/>
    </radialGradient>
    <!-- Cascavell daurat -->
    <radialGradient id="cascavellGold" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fff200"/>
      <stop offset="65%" stop-color="#ffb142"/>
      <stop offset="100%" stop-color="#cc8e35"/>
    </radialGradient>
  </defs>

  <!-- FONS -->
  <rect width="600" height="450" fill="url(#fonsVinyeta)"/>

  <!-- CAPA DE COLORS -->
  <g id="capa-color">
    <!-- Orelles -->
    <path d="M210 180 L190 80 L260 130 Z" fill="url(#gatPell)"/>
    <path d="M210 160 L200 100 L245 135 Z" fill="#ffb8b8"/>
    
    <path d="M390 180 L410 80 L340 130 Z" fill="url(#gatPell)"/>
    <path d="M390 160 L400 100 L355 135 Z" fill="#ffb8b8"/>

    <!-- Cos -->
    <path d="M230 310 Q210 370 200 420 L400 420 Q390 370 370 310" fill="url(#gatPell)"/>
    <!-- Pit blanc crema -->
    <path d="M260 330 Q300 370 340 330 Q360 410 340 420 L260 420 Q240 410 260 330 Z" fill="url(#blancMorro)"/>

    <!-- Cap taronja -->
    <path d="M210 180 C180 230 180 280 220 310 C250 330 350 330 380 310 C420 280 420 230 390 180 C360 150 240 150 210 180 Z" fill="url(#gatPell)"/>

    <!-- Zona morro blanca -->
    <ellipse cx="300" cy="265" rx="52" ry="32" fill="url(#blancMorro)"/>

    <!-- Ulls verds -->
    <ellipse cx="255" cy="225" rx="18" ry="24" fill="url(#ullsVerds)"/>
    <ellipse cx="345" cy="225" rx="18" ry="24" fill="url(#ullsVerds)"/>

    <!-- Collar turquesa -->
    <path d="M225 315 Q300 345 375 315" stroke="#00d2d3" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- Cascavell daurat -->
    <circle cx="300" cy="342" r="14" fill="url(#cascavellGold)"/>
  </g>

  <!-- CAPA DE LÍNIES NEGRES ORIGINALS (Per sobre) -->
  <g id="linies-gat" stroke="#111827" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M210 180 L190 80 L260 130 Z" stroke-width="4"/>
    <path d="M210 160 L200 100 L245 135 Z" stroke-width="2.5" stroke="#703030"/>
    
    <path d="M390 180 L410 80 L340 130 Z" stroke-width="4"/>
    <path d="M390 160 L400 100 L355 135 Z" stroke-width="2.5" stroke="#703030"/>

    <path d="M210 180 C180 230 180 280 220 310 C250 330 350 330 380 310 C420 280 420 230 390 180 C360 150 240 150 210 180 Z" stroke-width="4"/>

    <!-- Pupilles negres i reflexos -->
    <ellipse cx="255" cy="225" rx="18" ry="24" stroke-width="3"/>
    <ellipse cx="255" cy="225" rx="8" ry="18" fill="#111827" stroke="none"/>
    <circle cx="252" cy="216" r="4" fill="#ffffff" stroke="none"/>

    <ellipse cx="345" cy="225" rx="18" ry="24" stroke-width="3"/>
    <ellipse cx="345" cy="225" rx="8" ry="18" fill="#111827" stroke="none"/>
    <circle cx="342" cy="216" r="4" fill="#ffffff" stroke="none"/>

    <polygon points="300,248 290,238 310,238" fill="#ff7979" stroke="#111827" stroke-width="2"/>
    <path d="M300 248 L300 262"/>
    <path d="M300 262 Q280 275 265 262"/>
    <path d="M300 262 Q320 275 335 262"/>

    <path d="M225 245 L150 235" stroke-width="2.5"/>
    <path d="M220 258 L145 262" stroke-width="2.5"/>
    <path d="M225 270 L155 285" stroke-width="2.5"/>

    <path d="M375 245 L450 235" stroke-width="2.5"/>
    <path d="M380 258 L455 262" stroke-width="2.5"/>
    <path d="M375 270 L445 285" stroke-width="2.5"/>

    <path d="M230 310 Q210 370 200 420 L400 420 Q390 370 370 310" stroke-width="4"/>
    <path d="M260 340 L260 420" stroke-width="3.5"/>
    <path d="M245 420 Q245 405 260 405 Q275 405 275 420"/>
    <path d="M340 340 L340 420" stroke-width="3.5"/>
    <path d="M325 420 Q325 405 340 405 Q355 405 355 420"/>

    <path d="M225 315 Q300 345 375 315" stroke-width="3"/>
    <circle cx="300" cy="342" r="14" stroke-width="3"/>
    <circle cx="300" cy="344" r="3" fill="#111827" stroke="none"/>
  </g>
</svg>