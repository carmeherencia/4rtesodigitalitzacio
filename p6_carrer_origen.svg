<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Cel capvespre urbà -->
    <linearGradient id="celUrb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a69bd"/>
      <stop offset="50%" stop-color="#6a89cc"/>
      <stop offset="100%" stop-color="#f8c291"/>
    </linearGradient>
    <!-- Paret de maó -->
    <linearGradient id="paretMao" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b71540"/>
      <stop offset="100%" stop-color="#801025"/>
    </linearGradient>
    <!-- Paviment llambordes -->
    <linearGradient id="llambordesGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#718093"/>
      <stop offset="50%" stop-color="#485460"/>
      <stop offset="100%" stop-color="#2f3542"/>
    </linearGradient>
    <filter id="pilonaOmbra" x="-30%" y="-20%" width="170%" height="160%">
      <feDropShadow dx="14" dy="12" stdDeviation="6" flood-color="#1e272e" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- CEL -->
  <rect width="600" height="230" fill="url(#celUrb)"/>

  <!-- EDIFICIS DE FONS EN PERSPECTIVA -->
  <polygon points="0,180 160,195 240,210 240,230 0,230" fill="#2c3e50" opacity="0.6"/>
  <polygon points="400,160 600,120 600,240 400,240" fill="url(#paretMao)"/>

  <!-- Línies de maons a la paret dreta -->
  <line x1="420" y1="180" x2="600" y2="150" stroke="#560714" stroke-width="2"/>
  <line x1="410" y1="205" x2="600" y2="180" stroke="#560714" stroke-width="2"/>
  <line x1="400" y1="230" x2="600" y2="210" stroke="#560714" stroke-width="2"/>

  <!-- Fanil urbà antic -->
  <path d="M430 180 L430 140 M420 140 L440 140 M430 140 L430 130" stroke="#2d3436" stroke-width="4"/>
  <polygon points="425,130 435,130 438,118 422,118" fill="#ffeaa7" stroke="#2d3436" stroke-width="2"/>

  <!-- PAVIMENT DE LLAMBORDES EN PERSPECTIVA -->
  <polygon points="0,230 600,230 600,450 0,450" fill="url(#llambordesGrad)"/>

  <!-- Línies de fuga de les llambordes -->
  <line x1="280" y1="230" x2="40" y2="450" stroke="#1e272e" stroke-width="2" opacity="0.4"/>
  <line x1="300" y1="230" x2="160" y2="450" stroke="#1e272e" stroke-width="2" opacity="0.4"/>
  <line x1="320" y1="230" x2="300" y2="450" stroke="#1e272e" stroke-width="2" opacity="0.4"/>
  <line x1="340" y1="230" x2="440" y2="450" stroke="#1e272e" stroke-width="2" opacity="0.4"/>
  <line x1="360" y1="230" x2="570" y2="450" stroke="#1e272e" stroke-width="2" opacity="0.4"/>

  <!-- Línies horitzontals de llambordes que s'eixamplen -->
  <line x1="120" y1="260" x2="500" y2="260" stroke="#1e272e" stroke-width="1.8" opacity="0.5"/>
  <line x1="80" y1="300" x2="530" y2="300" stroke="#1e272e" stroke-width="2.2" opacity="0.55"/>
  <line x1="50" y1="350" x2="560" y2="350" stroke="#1e272e" stroke-width="2.5" opacity="0.6"/>
  <line x1="10" y1="410" x2="590" y2="410" stroke="#1e272e" stroke-width="3" opacity="0.65"/>

  <!-- OBJECTE CRIDANER A ELIMINAR: PILONA METÀL·LICA URBANA -->
  <g id="pilona-metal" filter="url(#pilonaOmbra)">
    <!-- Base pilona -->
    <ellipse cx="280" cy="390" rx="36" ry="12" fill="#1e272e"/>
    <ellipse cx="280" cy="386" rx="30" ry="10" fill="#2d3436"/>
    <!-- Cos cilíndric pilona -->
    <path d="M256 260 L256 386 C256 395 304 395 304 386 L304 260 Z" fill="#353b48"/>
    <!-- Franges reflectants grogues -->
    <rect x="256" y="275" width="48" height="14" fill="#fbc531"/>
    <rect x="256" y="300" width="48" height="14" fill="#fbc531"/>
    <!-- Cúpula superior esfèrica -->
    <ellipse cx="280" cy="260" rx="24" ry="14" fill="#718093"/>
    <circle cx="280" cy="248" r="10" fill="#2f3640"/>
  </g>

  <!-- Distintiu visual pedagogic -->
  <rect x="15" y="15" width="165" height="32" rx="6" fill="#eb4d4b" opacity="0.95"/>
  <text x="25" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ORIGEN: Amb objecte</text>
</svg>