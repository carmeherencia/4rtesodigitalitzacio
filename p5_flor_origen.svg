<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <!-- Fons blanc per a il·lustració de línies -->
  <rect width="600" height="450" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <g id="linies-negres" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Tija -->
    <path d="M300 240 Q305 330 285 410" stroke-width="6"/>
    
    <!-- Fulla esquerra -->
    <path d="M298 320 Q230 310 180 270 Q230 360 294 345 Z" fill="#ffffff" stroke-width="3.5"/>
    <path d="M296 333 Q240 310 180 270" stroke-width="2.5"/>
    <path d="M230 300 Q225 320 250 330" stroke-width="2"/>
    <path d="M260 320 Q265 335 285 340" stroke-width="2"/>

    <!-- Fulla dreta -->
    <path d="M295 360 Q370 340 420 310 Q370 400 290 380 Z" fill="#ffffff" stroke-width="3.5"/>
    <path d="M293 370 Q360 345 420 310" stroke-width="2.5"/>
    <path d="M350 340 Q355 365 335 375" stroke-width="2"/>
    <path d="M380 330 Q390 350 370 365" stroke-width="2"/>

    <!-- Pètals de la flor (12 pètals radials) -->
    <!-- Pètal Dalt -->
    <path d="M285 160 C270 90 330 90 315 160 Z" fill="#ffffff"/>
    <!-- Pètal Dalt-Dreta 1 -->
    <path d="M320 170 C365 110 415 150 340 190 Z" fill="#ffffff"/>
    <!-- Pètal Dreta-Dalt 2 -->
    <path d="M335 195 C410 160 435 220 345 220 Z" fill="#ffffff"/>
    <!-- Pètal Dreta -->
    <path d="M340 225 C420 225 420 285 340 250 Z" fill="#ffffff"/>
    <!-- Pètal Baix-Dreta -->
    <path d="M330 255 C390 310 340 350 310 265 Z" fill="#ffffff"/>
    <!-- Pètal Baix -->
    <path d="M305 265 C315 340 285 340 295 265 Z" fill="#ffffff"/>
    <!-- Pètal Baix-Esquerra -->
    <path d="M280 260 C240 330 190 290 270 250 Z" fill="#ffffff"/>
    <!-- Pètal Esquerra-Baix -->
    <path d="M265 245 C190 270 170 210 260 220 Z" fill="#ffffff"/>
    <!-- Pètal Esquerra -->
    <path d="M260 215 C180 200 190 140 265 190 Z" fill="#ffffff"/>
    <!-- Pètal Dalt-Esquerra -->
    <path d="M270 185 C210 130 260 95 290 165 Z" fill="#ffffff"/>

    <!-- Centre de la flor -->
    <circle cx="300" cy="215" r="45" fill="#ffffff" stroke-width="4"/>
    <!-- Detalls interiors del pol·len -->
    <circle cx="285" cy="200" r="4" fill="#1a1a1a"/>
    <circle cx="315" cy="200" r="4" fill="#1a1a1a"/>
    <circle cx="300" cy="215" r="5" fill="#1a1a1a"/>
    <circle cx="285" cy="228" r="4" fill="#1a1a1a"/>
    <circle cx="315" cy="228" r="4" fill="#1a1a1a"/>
    <circle cx="300" cy="190" r="3.5" fill="#1a1a1a"/>
    <circle cx="300" cy="238" r="3.5" fill="#1a1a1a"/>
    <circle cx="275" cy="215" r="3.5" fill="#1a1a1a"/>
    <circle cx="325" cy="215" r="3.5" fill="#1a1a1a"/>
  </g>
</svg>