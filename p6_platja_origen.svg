<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Cel d'estiu -->
    <linearGradient id="celPlatja" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ada9"/>
      <stop offset="40%" stop-color="#78e08f"/>
      <stop offset="100%" stop-color="#c7ecee"/>
    </linearGradient>
    <!-- Mar blava -->
    <linearGradient id="marBlau" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a3d62"/>
      <stop offset="50%" stop-color="#079992"/>
      <stop offset="100%" stop-color="#4bcffa"/>
    </linearGradient>
    <!-- Sorra daurada de platja -->
    <linearGradient id="sorraGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8c291"/>
      <stop offset="40%" stop-color="#e58e26"/>
      <stop offset="100%" stop-color="#b71540" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Filtre ombra per a la paperera -->
    <filter id="ombraObj" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="15" dy="12" stdDeviation="6" flood-color="#783800" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- CEL I SOL -->
  <rect width="600" height="180" fill="url(#celPlatja)"/>
  <circle cx="500" cy="80" r="35" fill="#f6b93b" opacity="0.85"/>
  <circle cx="500" cy="80" r="50" fill="#f6b93b" opacity="0.25"/>

  <!-- MAR -->
  <rect y="170" width="600" height="90" fill="url(#marBlau)"/>
  <!-- Onades blanques -->
  <path d="M0 240 Q60 230 120 240 T240 240 T360 240 T480 240 T600 240 L600 260 L0 260 Z" fill="#ffffff" opacity="0.7"/>
  <path d="M0 255 Q80 245 160 255 T320 255 T480 255 T600 255 L600 270 L0 270 Z" fill="#dff9fb" opacity="0.9"/>

  <!-- SORRA DE LA PLATJA -->
  <path d="M0 265 Q180 250 340 260 Q480 270 600 255 L600 450 L0 450 Z" fill="#f8c291"/>
  <path d="M0 320 Q200 290 400 330 Q520 350 600 310 L600 450 L0 450 Z" fill="#f6b93b" opacity="0.35"/>
  <path d="M0 380 Q250 350 500 390 L600 450 L0 450 Z" fill="#e58e26" opacity="0.25"/>

  <!-- Petites ondulacions de la sorra -->
  <path d="M60 330 Q120 325 180 332" stroke="#e58e26" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M220 360 Q300 352 380 362" stroke="#e58e26" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M420 340 Q490 335 560 342" stroke="#e58e26" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M120 400 Q200 392 290 402" stroke="#e58e26" stroke-width="2.5" fill="none" opacity="0.6"/>

  <!-- OBJECTE A ELIMINAR: PAPERERA / RESIDU CRIDANER -->
  <g id="objecte-eliminar" filter="url(#ombraObj)">
    <!-- Cos paperera vermella -->
    <rect x="250" y="270" width="70" height="95" rx="8" fill="#e55039"/>
    <!-- Franges i reixa -->
    <line x1="250" y1="290" x2="320" y2="290" stroke="#b71540" stroke-width="3"/>
    <line x1="250" y1="315" x2="320" y2="315" stroke="#b71540" stroke-width="3"/>
    <line x1="250" y1="340" x2="320" y2="340" stroke="#b71540" stroke-width="3"/>
    <!-- Tapa paperera -->
    <rect x="242" y="258" width="86" height="15" rx="5" fill="#2c3e50"/>
    <rect x="272" y="250" width="26" height="10" rx="3" fill="#34495e"/>
    <!-- Bossa de plàstic que sobresurt -->
    <path d="M255 260 Q240 240 250 225 Q265 240 262 260 Z" fill="#f1f2f6" opacity="0.9"/>
    <!-- Etiqueta reciclada -->
    <circle cx="285" cy="305" r="12" fill="#ffffff" opacity="0.9"/>
    <path d="M280 305 L285 300 L290 305 M285 300 L285 311" stroke="#e55039" stroke-width="2" fill="none"/>
  </g>

  <!-- Distintiu visual pedagogic -->
  <rect x="15" y="15" width="165" height="32" rx="6" fill="#eb4d4b" opacity="0.95"/>
  <text x="25" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ORIGEN: Amb objecte</text>
</svg>