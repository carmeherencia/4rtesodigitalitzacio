<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Cel de parc -->
    <linearGradient id="celParc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70a1ff"/>
      <stop offset="100%" stop-color="#dfe4ea"/>
    </linearGradient>
    <!-- Gespa verda -->
    <linearGradient id="gespaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7bed9f"/>
      <stop offset="30%" stop-color="#2ed573"/>
      <stop offset="100%" stop-color="#10ac84"/>
    </linearGradient>
    <!-- Arbres fons -->
    <radialGradient id="arbreFons" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2ed573"/>
      <stop offset="70%" stop-color="#1e90ff"/>
      <stop offset="100%" stop-color="#2f3542"/>
    </radialGradient>
    <filter id="coneShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="12" dy="10" stdDeviation="5" flood-color="#054425" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- CEL -->
  <rect width="600" height="200" fill="url(#celParc)"/>
  <!-- Núvols -->
  <ellipse cx="150" cy="80" rx="60" ry="22" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="180" cy="70" rx="40" ry="25" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="440" cy="95" rx="70" ry="24" fill="#ffffff" opacity="0.75"/>

  <!-- ARBRES DE FONS -->
  <path d="M-20 220 Q40 130 110 200 Q180 120 260 210 Q340 140 420 200 Q510 110 620 220 L620 260 L-20 260 Z" fill="#2ed573" opacity="0.85"/>
  <path d="M-20 230 Q60 160 140 220 Q230 150 320 225 Q400 160 480 230 Q550 170 620 235 L620 270 L-20 270 Z" fill="#10ac84" opacity="0.9"/>

  <!-- PRAT DE GESPA -->
  <path d="M0 240 Q150 225 300 235 Q450 245 600 230 L600 450 L0 450 Z" fill="url(#gespaGrad)"/>

  <!-- Trèvols i textura de gespa -->
  <path d="M50 300 Q60 285 70 300 Q60 315 50 300 Z" fill="#2ed573" opacity="0.7"/>
  <path d="M120 350 L122 335 M122 350 L126 332" stroke="#10ac84" stroke-width="2"/>
  <path d="M480 320 L483 305 M485 320 L490 303" stroke="#10ac84" stroke-width="2"/>
  <path d="M420 380 L423 360 M425 380 L430 358" stroke="#10ac84" stroke-width="2.5"/>
  <path d="M180 410 L184 390 M186 410 L192 388" stroke="#10ac84" stroke-width="2.5"/>

  <!-- OBJECTE CRIDANER A ELIMINAR: CON DE TRÀNSIT TARONJA -->
  <g id="con-transit" filter="url(#coneShadow)">
    <!-- Base negra/taronja del con -->
    <polygon points="240,360 360,360 350,375 250,375" fill="#2f3542"/>
    <polygon points="250,360 350,360 345,368 255,368" fill="#ff4757"/>
    <!-- Cos del con -->
    <polygon points="265,360 300,240 335,360" fill="#ff6b81"/>
    <!-- Franja reflectant blanca 1 -->
    <polygon points="274,330 300,240 326,330" fill="#ff4757"/>
    <polygon points="278,318 322,318 317,298 283,298" fill="#ffffff"/>
    <!-- Franja reflectant blanca 2 -->
    <polygon points="288,278 312,278 308,262 292,262" fill="#ffffff"/>
  </g>

  <!-- Distintiu visual pedagogic -->
  <rect x="15" y="15" width="165" height="32" rx="6" fill="#eb4d4b" opacity="0.95"/>
  <text x="25" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ORIGEN: Amb objecte</text>
</svg>