<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Degradat de fons suau -->
    <radialGradient id="fonsGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="60%" stop-color="#f0f7f4"/>
      <stop offset="100%" stop-color="#e2ede9"/>
    </radialGradient>
    <!-- Degradat pètals -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="70%" stop-color="#d63031"/>
      <stop offset="100%" stop-color="#b71540"/>
    </linearGradient>
    <!-- Degradat centre flor -->
    <radialGradient id="centreFlor" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="60%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#e17055"/>
    </radialGradient>
    <!-- Degradat tija i fulles -->
    <linearGradient id="fullaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55efc4"/>
      <stop offset="60%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#006266"/>
    </linearGradient>
    <linearGradient id="fullaGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ed573"/>
      <stop offset="70%" stop-color="#10ac84"/>
      <stop offset="100%" stop-color="#019031"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- CAPA 0: FONS -->
  <rect width="600" height="450" fill="url(#fonsGlow)"/>

  <!-- CAPA 1: COLORS (Pintat sota les línies) -->
  <g id="capa-colors" filter="url(#softShadow)">
    <!-- Tija -->
    <path d="M300 240 Q305 330 285 410" stroke="#10ac84" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Fulla esquerra -->
    <path d="M298 320 Q230 310 180 270 Q230 360 294 345 Z" fill="url(#fullaGrad1)"/>

    <!-- Fulla dreta -->
    <path d="M295 360 Q370 340 420 310 Q370 400 290 380 Z" fill="url(#fullaGrad2)"/>

    <!-- Pètals amb color vibrant -->
    <path d="M285 160 C270 90 330 90 315 160 Z" fill="url(#petalGrad)"/>
    <path d="M320 170 C365 110 415 150 340 190 Z" fill="url(#petalGrad)"/>
    <path d="M335 195 C410 160 435 220 345 220 Z" fill="url(#petalGrad)"/>
    <path d="M340 225 C420 225 420 285 340 250 Z" fill="url(#petalGrad)"/>
    <path d="M330 255 C390 310 340 350 310 265 Z" fill="url(#petalGrad)"/>
    <path d="M305 265 C315 340 285 340 295 265 Z" fill="url(#petalGrad)"/>
    <path d="M280 260 C240 330 190 290 270 250 Z" fill="url(#petalGrad)"/>
    <path d="M265 245 C190 270 170 210 260 220 Z" fill="url(#petalGrad)"/>
    <path d="M260 215 C180 200 190 140 265 190 Z" fill="url(#petalGrad)"/>
    <path d="M270 185 C210 130 260 95 290 165 Z" fill="url(#petalGrad)"/>

    <!-- Centre de la flor -->
    <circle cx="300" cy="215" r="45" fill="url(#centreFlor)"/>
  </g>

  <!-- CAPA 2: LÍNIES NEGRES ORIGINALS (Per sobre del color amb mode normal/multiplicar) -->
  <g id="linies-negres" stroke="#1e272e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M300 240 Q305 330 285 410" stroke-width="6"/>
    
    <path d="M298 320 Q230 310 180 270 Q230 360 294 345 Z" stroke-width="3.5"/>
    <path d="M296 333 Q240 310 180 270" stroke-width="2.5" stroke="#0a3d2e"/>
    <path d="M230 300 Q225 320 250 330" stroke-width="2" stroke="#0a3d2e"/>
    <path d="M260 320 Q265 335 285 340" stroke-width="2" stroke="#0a3d2e"/>

    <path d="M295 360 Q370 340 420 310 Q370 400 290 380 Z" stroke-width="3.5"/>
    <path d="M293 370 Q360 345 420 310" stroke-width="2.5" stroke="#0a3d2e"/>
    <path d="M350 340 Q355 365 335 375" stroke-width="2" stroke="#0a3d2e"/>
    <path d="M380 330 Q390 350 370 365" stroke-width="2" stroke="#0a3d2e"/>

    <path d="M285 160 C270 90 330 90 315 160 Z"/>
    <path d="M320 170 C365 110 415 150 340 190 Z"/>
    <path d="M335 195 C410 160 435 220 345 220 Z"/>
    <path d="M340 225 C420 225 420 285 340 250 Z"/>
    <path d="M330 255 C390 310 340 350 310 265 Z"/>
    <path d="M305 265 C315 340 285 340 295 265 Z"/>
    <path d="M280 260 C240 330 190 290 270 250 Z"/>
    <path d="M265 245 C190 270 170 210 260 220 Z"/>
    <path d="M260 215 C180 200 190 140 265 190 Z"/>
    <path d="M270 185 C210 130 260 95 290 165 Z"/>

    <circle cx="300" cy="215" r="45" stroke-width="4"/>
    <circle cx="285" cy="200" r="4" fill="#3d1d03" stroke="none"/>
    <circle cx="315" cy="200" r="4" fill="#3d1d03" stroke="none"/>
    <circle cx="300" cy="215" r="5" fill="#3d1d03" stroke="none"/>
    <circle cx="285" cy="228" r="4" fill="#3d1d03" stroke="none"/>
    <circle cx="315" cy="228" r="4" fill="#3d1d03" stroke="none"/>
    <circle cx="300" cy="190" r="3.5" fill="#3d1d03" stroke="none"/>
    <circle cx="300" cy="238" r="3.5" fill="#3d1d03" stroke="none"/>
    <circle cx="275" cy="215" r="3.5" fill="#3d1d03" stroke="none"/>
    <circle cx="325" cy="215" r="3.5" fill="#3d1d03" stroke="none"/>
  </g>
</svg>