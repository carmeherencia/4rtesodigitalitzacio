  <!-- Distintiu visual -->
  <rect x="15" y="15" width="225" height="32" rx="6" fill="#20bf6b" opacity="0.95"/>
  <text x="25" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">FINAL: Retrat professional ✓</text>
